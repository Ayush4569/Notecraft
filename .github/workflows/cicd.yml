name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 

      - name: Install dependencies
        working-directory: ./server
        run: npm install

      - name: Build Docker image
        working-directory: ./server
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/notecraft:latest .

      - name: Login to Docker Hub
        working-directory: ./server
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        working-directory: ./server
        run: docker push ${{ secrets.DOCKER_USERNAME }}/notecraft:latest

      - name: ✅ Done
        run: echo "Image pushed to Docker Hub!"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            cd /home/ubuntu
            rm -rf Notecraft
            echo "clonning repo"
            git clone https://github.com/Ayush4569/Notecraft.git
            cd Notecraft
            rm -rf frontend
            cd server
            echo "${{secrets.ENV_CONTENT }}" > .env
            chmod 600 .env
            docker-compose down || true
            echo "🐳 Pruning docker containers..."
            docker container prune -f
            docker rmi ${{ secrets.DOCKER_USERNAME }}/notecraft:latest || true
            docker rmi redis:7-alpine || true
            echo "⬇️ Pulling image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/notecraft:latest
            echo "🚀 Starting up containers..."
            docker-compose up -d
