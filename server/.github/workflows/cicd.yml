name : CI/CD Pipeline
on: 
  push:
    branches: [main]

jobs:
  build-and-deploy :
    runs-on: ubuntu-latest
    
    steps: 
      - name : Check code
        uses : actions/checkout@v3

      - name : Setup Node.js
        uses  : actions/setup-node@v3
        with : 
          node-version : 23.5.0
      
      - name :  Install dependencies
        run : npm install

      - name : Build Docker image
        run : docker build -t ${{secrets.DOCKER_USERNAME}}/notecraft:latest .

      - name : Login to Docker Hub
        run : echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      
      - name : Push to Docker hub
        run : docker push ${{secrets.DOCKER_USERNAME}}/notecraft:latest

      - name : ✅ Done
        run:  echo "Image pushed to Docker Hub!"

      - name : Deploy to EC2 via ssh
        uses : appleboy/ssh-action@v1.0.0
        with :
          host : ${{secrets.EC2_HOST }}
          username : ${{secrets.EC2_USER }}
          key : ${{secrets:EC2_SSH_KEY }}
          script : |
            docker container stop notecraft -f || true
            docker container stop notecraft-redis -f || true
            docker container prune -f
            docker rmi ${{ secrets.DOCKER_USERNAME }}/notecraft:latest ||true 
            docker rmi redis:7-alpine || true    
            docker pull ${{ secrets.DOCKER_USERNAME }}/notecraft:latest
            cd /home/ubuntu/src
            docker-compose up -d

