services:
  nodejs:
    image: ayush0827/notecraft:v2
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - redis
    
  redis : 
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: redis-server --requirepass ayush@0827
    volumes:
      - redis-data:/data
  

volumes:
  - redis-data:
