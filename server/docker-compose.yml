services:
  nodejs:
    container_name: notecraft
    image: ayush0827/notecraft:latest
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - redis
    restart: always
    
  redis : 
    image: redis:7-alpine
    container_name: notecraft-redis
    volumes:
      - redis-data:/data
    restart: always
  

volumes:
   redis-data:
